service:
  name: commerce
  description: 'RCA 테스트베드 commerce 플래그십 (대폭 확장판, 구 plopvape-shop 후속).

    109 KVM 게스트 VM kubeadm 클러스터(rca-testbed-commerce ns): nginx + api-gateway +
    9개 서비스(order/product/inventory/payment/notification/user/cart/pricing/shipping)
    + postgres + redis + kafka. baseline 부하는 tb-runner(192.168.122.206)의
    loadgen systemd 3유닛이 상주 생성.

    부하 시나리오 규칙 정본: testbed-services docs/spec-scenario-load.md (R0~R9).

    '
  owner: ydkim
  linear_project: RCA 테스트베드
target:
  server: 192.168.200.109
  ssh_user: root
  arch: arm64
  namespace: rca-testbed-commerce
  kubeconfig: /root/tb-kubeconfig
  api_base: http://192.168.122.77:30080
scenarios:
- id: scenario-01
  file: scenario-01-blackfriday-surge.sh
  title: Black Friday Surge (L1)
  description: baseline 대비 배수 기반 인입 트래픽 폭주 → order 경로 처리 용량 포화.
    구 plopvape scenario-04(절대 동시성 정의)의 개정판 — 배수 정의·tb-runner 주입·
    expected_anomalies 형식의 첫 적용.
  cause_domain: APM
  root_cause:
    target_kind: service
    target_id_source: commerce api-gateway/order-service의 APM target (119 targets 테이블에서
      service.name 매칭 — golden 승격 시 정본 target_id로 교체)
    mechanism: 인입 트래픽이 baseline 대비 8배(기본값, 캘리브레이션 대상)로 급증하여
      order 경로의 HikariCP 커넥션 풀·처리 용량이 포화, latency 급등과 5xx 발생
  expected_depth: entity
  injection:
    script: scenario-01-blackfriday-surge.sh
    parameters:
      load:
        journeys: [browsing, cart, checkout]   # checkout 가중 50% — 주문 폭주형 mix
        intensity_multiplier: 8                # baseline 대비 배수 (R4 — 절대 RPS 아님)
        ramp: { up: 2m, hold: 8m, down: 1m }
        seed: 4242
      surge_script: testbed-services commerce/loadgen/surge.js (tb-runner /opt/loadgen/commerce/surge.js 배치본)
      entry: http://192.168.122.77:30080 (tb-cp NodePort — baseline과 동일 경로, R2)
  expected_anomalies:
  - target: order-service APM target (target_id_source — 승격 시 정본 교체)
    signal: metric
    name: db.client.connections.pending_requests / connections.usage (HikariCP)
    direction: up
    within: 5m
    precondition: ai_coverages에 해당 (target×metric) 등록 — 검증 패스에서 선행 확인
  - target: commerce 게이트웨이/order route
    signal: trace
    name: trace-anomaly distribution_shift (order 경로 latency 분포 우측 이동)
    direction: up
    within: 10m
    precondition: trace-anomaly AllowTarget 커버리지 (60분 배치 주기 감안)
  - target: tb-w1 (commerce worker)
    signal: metric
    name: sms.cpu.utilization 계열 level shift
    direction: up
    within: 10m
    precondition: ai_coverages 등록
  signals:
    must_support:
    - 인입 throughput/호출량이 baseline 대비 수 배 spike (시작점이 트래픽)
    - HikariCP pending/timeout 및 DB 세션 급증이 트래픽 spike 이후에 발생
    - order → product/inventory/payment cascade 지연 전파 (trace)
    must_rule_out:
    - DB 자체 결함 아님 — slow query/lock 정상 (트래픽 유입이 원인)
    - 배포/설정 변경 없음 (change 이벤트 부재)
    expected_missing: []
  propagation:
  - 인입 트래픽 8배 급증 (north-south, 게이트웨이 경유)
  - order 경로 HikariCP 풀 포화 → pending_requests 증가 → 획득 대기
  - 응답 지연 → 상류 게이트웨이 latency 급등 → 일부 5xx/timeout
  - 사용자 체감: 주문 실패·페이지 지연 (인시던트 격상 조건 R0 충족)
  estimated_duration_sec: 720
  side_effects:
  - baseline loadgen은 건드리지 않음(R1) — 스크립트가 사전·사후로 active 확인
  - surge 종료 후 잔존 k6는 cleanup이 pkill (매칭 태그 surge.js 한정 — baseline 안전)
  - 구 scenario-04와 달리 재고 조작·rolling restart 없음 — 회복은 부하 해제만으로 관측
  difficulty: 3
  expected_rca_root_cause: 'order 경로의 인입 트래픽이 baseline 대비 수 배(기본 8배)로
    급증하여 HikariCP 커넥션 풀과 처리 용량이 포화된 것이 시작점. 결정적 시그널: 트래픽
    spike가 시간상 최선행, HikariCP pending/DB 세션 급증이 뒤따름, cascade 지연 전파.
    DB lock/slow query나 배포 변경으로 확정하면 오답 — 해당 신호는 정상이다.

    '
